<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GridMaster</title>
<!-- 引入 CEP 基础库 -->
<script src="./lib/CSInterface.js"></script>

<style>
/* 核心主题变量 (与 Adobe 主题色同步) */
:root {
--gm-bg-primary: #2b2b2b;
--gm-bg-secondary: #3c3c3c;
--gm-bg-tertiary: #505050;
--gm-text-primary: #e0e0e0;
--gm-text-secondary: #b0b0b0;
--gm-text-tertiary: #808080;
--gm-accent-primary: #007aff;
--gm-accent-danger: #ff3b30;
--gm-border-default: #1e1e1e;
}

body, html {
margin: 0; padding: 0;
width: 100%; height: 100%;
font-family: 'Segoe UI', Tahoma, sans-serif;
background-color: var(--gm-bg-primary);
color: var(--gm-text-primary);
overflow: hidden;
}

#app-root {
display: flex;
flex-direction: column;
height: 100vh;
}

#content-area {
flex: 1;
overflow-y: auto;
padding: 10px;
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--gm-bg-tertiary); }
</style>
</head>
<body>

<div id="app-root">
<!-- 动态渲染区域 -->
</div>

<!-- 核心逻辑脚本 (按依赖顺序加载) -->
<script src="./js/libs/theme-manager.js"></script> <!-- 主题同步 -->
<script src="./js/host-adapter.js"></script>      <!-- 与 ExtendScript 通信 -->
<script src="./js/undo-manager.js"></script>      <!-- 撤销/重做 -->
<script src="./js/batch-processor.js"></script>   <!-- 批处理引擎 -->
<script src="./js/ui-components.js"></script>     <!-- 通用 UI 组件 -->
<script src="./js/app.js"></script>               <!-- 业务逻辑入口 -->

<script>
// 初始化应用
document.addEventListener('DOMContentLoaded', function() {
// 1. 初始化 CEP 主题监听
new ThemeManager().init();

// 2. 启动应用
initApp();
});
</script>
</body>
</html>
