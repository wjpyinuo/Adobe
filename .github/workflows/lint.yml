name: CI

on:
  push:
    paths:
      - 'AI/DotGridMaster_CEP/js/**'
      - 'AI/DotGridMaster_CEP/test/**'
      - 'AI/DotGridMaster_CEP/package.json'
      - 'AI/DotGridMaster_CEP/.eslintrc.json'
  pull_request:
    paths:
      - 'AI/DotGridMaster_CEP/js/**'
      - 'AI/DotGridMaster_CEP/test/**'
      - 'AI/DotGridMaster_CEP/package.json'
      - 'AI/DotGridMaster_CEP/.eslintrc.json'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI/DotGridMaster_CEP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint:check

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI/DotGridMaster_CEP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
